<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Pollutant-Weather Analysis in Chicago</title>
  <desc id="desc">Reproducible pipeline joining Chicago weather with EPA NO2 data</desc>
  <defs>
    <linearGradient id="pw-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4F7FB"/>
      <stop offset="100%" stop-color="#E2EAF4"/>
    </linearGradient>
    <linearGradient id="pw-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pw-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="pw-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E3A8A" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#pw-paper)"/>
  <rect x="1.5" y="1.5" width="1197" height="417" rx="26.5" fill="none" stroke="#C9D6E8"/>
  <g stroke="#C9D6E8" stroke-width="1" opacity="0.55">
    <path d="M80 0v420M160 0v420M1040 0v420M1120 0v420"/>
    <path d="M0 80h1200M0 340h1200"/>
  </g>
  <rect x="360" y="0" width="480" height="8" fill="url(#pw-glow)"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, sans-serif">
    <text x="88" y="108" font-size="38" font-weight="700" letter-spacing="-1" fill="#1E3A8A">Pollutant-Weather</text>
    <text x="88" y="150" font-size="28" font-weight="600" fill="#2563EB">Analysis in Chicago</text>
    <line x1="88" y1="168" x2="340" y2="168" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round"/>
    <text x="88" y="208" font-size="18" fill="#475569">How temperature, humidity, and wind move with EPA NO₂.</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">
    <rect x="88" y="240" width="86" height="32" rx="16" fill="#FFFFFF" stroke="#C9D6E8"/>
    <circle cx="108" cy="256" r="5" fill="#2563EB"/>
    <text x="122" y="261" fill="#1E3A8A">EPA</text>
    <rect x="184" y="240" width="118" height="32" rx="16" fill="#FFFFFF" stroke="#C9D6E8"/>
    <circle cx="204" cy="256" r="5" fill="#0EA5E9"/>
    <text x="218" y="261" fill="#1E3A8A">Chicago</text>
    <rect x="312" y="240" width="132" height="32" rx="16" fill="#FFFFFF" stroke="#C9D6E8"/>
    <circle cx="332" cy="256" r="5" fill="#64748B"/>
    <text x="346" y="261" fill="#1E3A8A">Snakemake</text>
  </g>

  <g transform="translate(690,68)" filter="url(#pw-soft)" font-family="ui-sans-serif, system-ui, sans-serif">
    <rect width="424" height="284" rx="20" fill="#FFFFFF" stroke="#C9D6E8"/>
    <rect x="16" y="16" width="392" height="120" rx="14" fill="url(#pw-sky)"/>
    <!-- skyline -->
    <g fill="#1E3A8A" opacity="0.85" transform="translate(36,46)">
      <rect x="0" y="40" width="28" height="58"/>
      <rect x="34" y="18" width="22" height="80"/>
      <rect x="62" y="8" width="18" height="90"/>
      <rect x="86" y="28" width="36" height="70"/>
      <rect x="128" y="0" width="16" height="98"/>
      <rect x="150" y="22" width="30" height="76"/>
      <rect x="186" y="36" width="24" height="62"/>
      <rect x="216" y="14" width="20" height="84"/>
      <rect x="242" y="30" width="40" height="68"/>
      <rect x="288" y="44" width="26" height="54"/>
    </g>
    <!-- dual series chart -->
    <text x="24" y="160" font-size="13" font-weight="700" fill="#1E3A8A">Weather × NO₂</text>
    <path d="M32 250 C 90 230, 130 200, 180 210 S 280 188, 392 176" fill="none" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round"/>
    <path d="M32 188 C 90 210, 140 236, 200 220 S 300 248, 392 232" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0 500; 500 0" dur="2.4s" fill="freeze"/>
    </path>
    <circle cx="32" cy="250" r="4" fill="#0EA5E9"/>
    <circle cx="392" cy="176" r="4" fill="#0EA5E9"/>
    <text x="24" y="274" font-size="11" fill="#64748B">humidity / wind · NO₂ concentration</text>
  </g>
</svg>
